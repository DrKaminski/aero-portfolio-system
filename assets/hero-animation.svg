<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" style="background: #0a0a1f;">
  <!-- Starfield -->
  <defs>
    <style>
      @keyframes twinkle {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      .star { animation: twinkle 4s infinite; }
    </style>
  </defs>
  
  <!-- Background Stars -->
  <circle cx="100" cy="50" r="2" fill="#fff" class="star" style="animation-delay: 0s"/>
  <circle cx="250" cy="80" r="1.5" fill="#fff" class="star" style="animation-delay: 1.2s"/>
  <circle cx="400" cy="40" r="2" fill="#fff" class="star" style="animation-delay: 0.8s"/>
  <circle cx="550" cy="120" r="1" fill="#fff" class="star" style="animation-delay: 2.1s"/>
  <circle cx="700" cy="60" r="2" fill="#fff" class="star" style="animation-delay: 0.5s"/>
  <circle cx="150" cy="200" r="1.5" fill="#fff" class="star" style="animation-delay: 1.8s"/>
  <circle cx="350" cy="220" r="2" fill="#fff" class="star" style="animation-delay: 0.3s"/>
  <circle cx="600" cy="180" r="1" fill="#fff" class="star" style="animation-delay: 2.5s"/>
  
  <!-- Rocket -->
  <g>
    <!-- Rocket Body -->
    <polygon points="380,220 400,100 420,220" fill="#c0c0c0" stroke="#fff" stroke-width="4"/>
    <!-- Nose Cone -->
    <polygon points="390,100 400,60 410,100" fill="#ff4444" stroke="#fff" stroke-width="3"/>
    <!-- Fins -->
    <polygon points="380,220 360,250 380,240" fill="#666" stroke="#fff" stroke-width="2"/>
    <polygon points="420,220 440,250 420,240" fill="#666" stroke="#fff" stroke-width="2"/>
    
    <!-- Flames (Animated) -->
    <g id="flames">
      <polygon points="390,230 395,270 400,255 405,270 410,230" fill="#ff8800" opacity="0.9">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="0.4s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="393,235 397,265 400,250 403,265 407,235" fill="#ffdd44" opacity="0.8">
        <animate attributeName="opacity" values="0.5;0.9;0.5" dur="0.35s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>
  
  <!-- Orbiting Elements -->
  <circle cx="500" cy="150" r="8" fill="#44ddff" opacity="0.7">
    <animateMotion path="M 0,0 A 80,80 0 0 1 160,0" dur="8s" repeatCount="indefinite"/>
  </circle>
  
  <text x="400" y="280" text-anchor="middle" fill="#ffffff" font-size="18" font-family="monospace">CHRISTOPHER KAMINSKI • AEROSPACE SYSTEMS</text>
</svg>